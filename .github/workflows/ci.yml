name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Check core crate (default features)
        run: cargo check -p encdr --all-targets

      - name: Check core crate (no default features / CPU-only)
        run: cargo check -p encdr --no-default-features --all-targets

      - name: Check core crate (all features)
        run: cargo check -p encdr --all-features --all-targets

      - name: Check encdr-view
        run: cargo check -p encdr-view --all-targets

      - name: Run encdr unit tests
        run: cargo test -p encdr --lib

      - name: Run encdr unit tests (no default features)
        run: cargo test -p encdr --no-default-features --lib

      - name: Run clippy on encdr
        run: cargo clippy -p encdr --all-targets
