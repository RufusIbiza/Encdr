<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 480px;
    height: 272px;
    overflow: hidden;
    background: #0d0f14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e0e6ed;
    user-select: none;
  }
  .container {
    width: 480px;
    height: 272px;
    display: flex;
    flex-direction: column;
    padding: 8px 12px;
    background: radial-gradient(circle at 50% 0%, #201726 0%, #0d0f14 100%);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 26px;
    border-bottom: 2px solid #ff2a8d;
    padding-bottom: 4px;
    margin-bottom: 6px;
  }
  .title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #ff3399;
    text-shadow: 0 0 10px rgba(255, 51, 153, 0.5);
  }
  .badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: #2b1120;
    color: #ff55aa;
    border: 1px solid #992255;
    font-weight: 600;
  }
  .groups-row {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    height: 38px;
    margin-bottom: 8px;
  }
  .group-btn {
    flex: 1;
    border-radius: 6px;
    background: rgba(30, 22, 35, 0.8);
    border: 1.5px solid #4a2c42;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    color: #ff77bb;
    transition: background 0.05s, transform 0.05s, box-shadow 0.05s;
  }
  .group-btn.active {
    background: #ffffff !important;
    color: #000000 !important;
    border-color: #ffd700 !important;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 8px #ff0077;
    transform: scale(0.96);
  }
  .log-container {
    flex: 1;
    background: rgba(14, 18, 25, 0.9);
    border: 1px solid #232d3d;
    border-radius: 6px;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .log-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #65778f;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .log-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 10px;
  }
  .log-item {
    display: flex;
    align-items: center;
    color: #a4b3c6;
    line-height: 1.3;
  }
  .log-item:first-child {
    color: #00ffa2;
    font-weight: 700;
  }
  .log-time {
    color: #55667d;
    margin-right: 8px;
    font-size: 9px;
  }
  .footer {
    height: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 9px;
    color: #65778f;
    margin-top: 4px;
    border-top: 1px solid #1a2230;
    padding-top: 2px;
  }
  .footer-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00ffa2;
    margin-right: 4px;
    box-shadow: 0 0 6px #00ffa2;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="title">GROUP BUTTONS &bull; TELEMETRY</span>
    <span class="badge">GPU RENDERER</span>
  </div>
  
  <div class="groups-row" id="groupsRow"></div>

  <div class="log-container">
    <div class="log-title">REAL-TIME USB INPUT LOG</div>
    <div class="log-list" id="logList">
      <div class="log-item"><span class="log-time">[0.0s]</span>LISTENING FOR MASCHINE MK3 EVENTS...</div>
    </div>
  </div>

  <div class="footer">
    <span><span class="footer-dot"></span>ENCDR SUB-MILLISECOND USB THREAD</span>
    <span>30 FPS WEBKIT SNAPSHOT</span>
  </div>
</div>

<script>
const GROUPS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
const groupsRow = document.getElementById('groupsRow');
const groupBtns = {};

GROUPS.forEach(g => {
  const btn = document.createElement('div');
  btn.className = 'group-btn';
  btn.id = 'grp_' + g.toLowerCase();
  btn.textContent = g;
  groupsRow.appendChild(btn);
  groupBtns[g.toLowerCase()] = btn;
});

const logList = document.getElementById('logList');

window.encdr = {
  onMessage(channel, data) {
    if (channel === 'telemetry') {
      const { group_states, group_hues, events } = data;
      
      // Update group buttons
      GROUPS.forEach((g, i) => {
        const key = g.toLowerCase();
        const btn = groupBtns[key];
        const isPressed = group_states && group_states[i];
        const hue = group_hues ? group_hues[i] : (i * 45);

        if (isPressed) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
          btn.style.borderColor = `hsl(${hue}, 85%, 55%)`;
          btn.style.color = `hsl(${hue}, 85%, 65%)`;
          btn.style.background = `hsla(${hue}, 70%, 15%, 0.8)`;
        }
      });

      // Update event log
      if (events && events.length > 0) {
        logList.innerHTML = events.map(ev => 
          `<div class="log-item"><span class="log-time">[${ev.time.toFixed(1)}s]</span>${ev.text}</div>`
        ).join('');
      }
    }
  }
};
</script>
</body>
</html>
