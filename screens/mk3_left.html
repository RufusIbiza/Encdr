<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 480px;
    height: 272px;
    overflow: hidden;
    background: #0a0a0a;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    color: #ccc;
  }
</style>
</head>
<body>
<canvas id="c" width="480" height="272"></canvas>
<script>
const W = 480, H = 272;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const ACCENT = '#00ccff';
const DIM = '#1a1a1a';
const BORDER = '#2a2a2a';
const TEXT = '#888';
const TEXT_DIM = '#555';

// State — left screen shows encoders 1-4, top buttons 1-4
const state = {
  screen_encoder_1: 0.5, screen_encoder_2: 0.5,
  screen_encoder_3: 0.5, screen_encoder_4: 0.5,
  encoder_touch_1: false, encoder_touch_2: false,
  encoder_touch_3: false, encoder_touch_4: false,
  top_1: false, top_2: false, top_3: false, top_4: false,
  group_a: false, group_b: false, group_c: false, group_d: false,
  group_e: false, group_f: false, group_g: false, group_h: false,
  event: '',
};

// Knob rendering on Canvas
function drawKnob(cx, cy, r, value, touched) {
  const startAngle = Math.PI * 0.75;
  const endAngle = Math.PI * 2.25;
  const valAngle = startAngle + value * (endAngle - startAngle);

  // Touch ring
  if (touched) {
    ctx.beginPath();
    ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
    ctx.strokeStyle = ACCENT;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Background circle
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = DIM;
  ctx.fill();
  ctx.strokeStyle = BORDER;
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Background arc
  ctx.beginPath();
  ctx.arc(cx, cy, r, startAngle, endAngle);
  ctx.strokeStyle = BORDER;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Value arc
  if (value > 0.001) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, startAngle, valAngle);
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Indicator line
  const ix1 = cx + r * 0.35 * Math.cos(valAngle);
  const iy1 = cy + r * 0.35 * Math.sin(valAngle);
  const ix2 = cx + r * 0.85 * Math.cos(valAngle);
  const iy2 = cy + r * 0.85 * Math.sin(valAngle);
  ctx.beginPath();
  ctx.moveTo(ix1, iy1);
  ctx.lineTo(ix2, iy2);
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.stroke();
}

function drawButton(x, y, w, h, active, label) {
  ctx.fillStyle = active ? ACCENT : DIM;
  ctx.strokeStyle = active ? ACCENT : BORDER;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 3);
  ctx.fill();
  ctx.stroke();

  if (active) {
    ctx.shadowColor = ACCENT;
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (label) {
    ctx.fillStyle = active ? '#000' : TEXT_DIM;
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2);
  }
}

function drawGroupButton(x, y, size, active, label) {
  ctx.fillStyle = active ? ACCENT : DIM;
  ctx.strokeStyle = active ? ACCENT : BORDER;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(x, y, size, size, 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = active ? '#000' : TEXT_DIM;
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + size / 2, y + size / 2);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // Top buttons row
  const btnW = 90, btnH = 28, btnY = 10;
  const btnStartX = (W - 4 * btnW - 3 * 12) / 2;
  for (let i = 0; i < 4; i++) {
    const x = btnStartX + i * (btnW + 12);
    drawButton(x, btnY, btnW, btnH, state['top_' + (i + 1)], 'TOP ' + (i + 1));
  }

  // Separator
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(16, 48);
  ctx.lineTo(W - 16, 48);
  ctx.stroke();

  // Title area
  ctx.fillStyle = TEXT_DIM;
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('MASCHINE MK3 — LEFT', W / 2, 64);

  // Last event
  ctx.fillStyle = TEXT_DIM;
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(state.event || 'waiting...', W / 2, 80);

  // Group buttons (A-H)
  const grpSize = 28, grpGap = 8;
  const grpStartX = (W - 8 * grpSize - 7 * grpGap) / 2;
  const grpY = 92;
  const groups = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
  for (let i = 0; i < 8; i++) {
    const x = grpStartX + i * (grpSize + grpGap);
    drawGroupButton(x, grpY, grpSize, state['group_' + groups[i]], groups[i].toUpperCase());
  }

  // Separator
  ctx.beginPath();
  ctx.moveTo(16, 132);
  ctx.lineTo(W - 16, 132);
  ctx.strokeStyle = '#1a1a1a';
  ctx.stroke();

  // Encoders row
  const encR = 28;
  const encY = 180;
  const encStartX = W / 8;
  const encSpacing = W / 4;

  for (let i = 0; i < 4; i++) {
    const cx = encStartX + i * encSpacing;
    const val = state['screen_encoder_' + (i + 1)];
    const touched = state['encoder_touch_' + (i + 1)];

    drawKnob(cx, encY, encR, val, touched);

    // Value text
    ctx.fillStyle = TEXT;
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(val.toFixed(3), cx, encY + encR + 16);

    // Label
    ctx.fillStyle = TEXT_DIM;
    ctx.font = '9px sans-serif';
    ctx.fillText('ENC ' + (i + 1), cx, encY - encR - 8);
  }
}

window.encdr = {
  onMessage(channel, data) {
    if (channel === 'controls') {
      Object.assign(state, data);
      render();
    }
    if (channel === 'event') {
      state.event = data;
      render();
    }
  }
};

render();
</script>
</body>
</html>
