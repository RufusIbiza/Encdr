[package]
name = "encdr-examples"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
encdr = { path = "../encdr" }
encdr-view = { path = "../encdr-view" }
nusb = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── General Utilities ──

[[bin]]
name = "probe"
path = "utils/probe.rs"

[[bin]]
name = "monitor"
path = "utils/monitor.rs"

