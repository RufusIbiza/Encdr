[package]
name = "s8_discovery"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "s8_discovery"
path = "src/main.rs"

[[bin]]
name = "led_test"
path = "src/bin/led_test.rs"

[[bin]]
name = "usb_debug"
path = "src/bin/usb_debug.rs"

[[bin]]
name = "systematic_led_test"
path = "src/bin/systematic_led_test.rs"

[[bin]]
name = "led_mapper"
path = "src/bin/led_mapper.rs"

[[bin]]
name = "touchstrip_test"
path = "src/bin/touchstrip_test.rs"

[[bin]]
name = "touchstrip_bicolor_test"
path = "src/bin/touchstrip_bicolor_test.rs"

[[bin]]
name = "touchstrip_d2_addresses"
path = "src/bin/touchstrip_d2_addresses.rs"

[[bin]]
name = "offset_scanner"
path = "src/bin/offset_scanner.rs"

[[bin]]
name = "touchstrip_prefix_test"
path = "src/bin/touchstrip_prefix_test.rs"

[[bin]]
name = "full_buffer_test"
path = "src/bin/full_buffer_test.rs"

[[bin]]
name = "touchstrip_step_test"
path = "src/bin/touchstrip_step_test.rs"

[[bin]]
name = "buffer_size_test"
path = "src/bin/buffer_size_test.rs"

[[bin]]
name = "steyr_style_test"
path = "src/bin/steyr_style_test.rs"

[[bin]]
name = "blit_led_test"
path = "src/bin/blit_led_test.rs"

[[bin]]
name = "screen_header_test"
path = "src/bin/screen_header_test.rs"

[[bin]]
name = "screen_iface_test"
path = "src/bin/screen_iface_test.rs"

[[bin]]
name = "touchstrip_high_offset_scan"
path = "src/bin/touchstrip_high_offset_scan.rs"

[[bin]]
name = "touchstrip_decompile_test"
path = "src/bin/touchstrip_decompile_test.rs"

[[bin]]
name = "touchstrip_colour_map"
path = "src/bin/touchstrip_colour_map.rs"

[[bin]]
name = "touchstrip_blue_test"
path = "src/bin/touchstrip_blue_test.rs"

[dependencies]
nusb = "0.1"
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"

[dev-dependencies]
