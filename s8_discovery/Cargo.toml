[package]
name = "s8_discovery"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "s8_discovery"
path = "src/main.rs"

[dependencies]
nusb = "0.1"
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"

[dev-dependencies]
