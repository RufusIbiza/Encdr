[package]
name = "encdr"
version.workspace = true
edition.workspace = true
description = "Native Instruments USB HID hardware and screen communication layer"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["native-instruments", "ni", "hid", "controller", "hardware"]
categories = ["hardware-support", "multimedia::audio"]

[dependencies]
# USB transport
nusb = "0.1"

# GPU compute (format conversion + frame diff)
wgpu = "23"
bytemuck = { version = "1", features = ["derive"] }

# Lock-free event channel
crossbeam-channel = "0.5"

# Async-aware command channel (lets the device thread block on either
# a USB read or an incoming command, instead of polling)
async-channel = "2"

# Descriptor parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Error handling
thiserror = "2"

# Async executor (internal, lightweight)
futures-lite = "2"

# Timer for the device thread's periodic pad-timeout sweep (see device_thread.rs)
async-io = "2"

# String interning for control names
once_cell = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Real-time thread scheduling for the USB read path (see device_thread.rs)
libc = "0.2"
