[package]
name = "encdr-skia"
version.workspace = true
edition.workspace = true
description = "GPU-accelerated Skia 2D screen renderer for encdr controller screens"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["native-instruments", "ni", "skia", "vulkan", "display"]
categories = ["hardware-support", "gui"]

[dependencies]
encdr = { version = "0.9.6", path = "../encdr" }
skia-safe = "0.153"
ash = { version = "0.38", optional = true }
tracing = "0.1"

[features]
default = ["vulkan"]
vulkan = ["dep:ash", "skia-safe/ganesh", "skia-safe/vulkan"]
